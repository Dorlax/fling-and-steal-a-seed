name: Vitrine

# À la demande seulement : une note de Demandes/ avec « type: vitrine » au statut « prêt »,
# ou onglet Actions, Vitrine, Run workflow.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Note de demande liée (facultatif)"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ vars.MODELE_LEGER || 'claude-haiku-5-5' }} --max-turns 20 --allowedTools "Read,Write,Glob,Bash(git:*)"
          prompt: |
            Suis .claude/agents/vitrine.md pour la version actuellement en ligne.
            Note de demande liée : "${{ inputs.note }}" (si renseignée, passe son statut à « fait »).
